<section class="metrics-section" aria-label="Metrics Overview">
    @for (card of cards(); track card.label) {
    <div class="metrics-item">
        <article class="card kpi-card p-4">
            <div class="value mb-1">{{ card.value }}</div>
            <div class="text-uppercase fw-bold metric-label">{{ card.label }}</div>
        </article>
    </div>
    }
</section>
