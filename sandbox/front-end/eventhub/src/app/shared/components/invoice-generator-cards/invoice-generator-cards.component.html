<section aria-label="Invoice generation options">
    <h2 class="section-break">{{ sectionTitle() }}</h2>

    <div class="billing-panels mb-4">
        <article class="card billing-panel p-4 d-flex flex-column" aria-labelledby="batch-billing-title">
            <h3 id="batch-billing-title" class="h6 fw-bold mb-2">All Organizers - This Month</h3>
            <p class="panel-muted mb-4">Runs monthly billing for every active organizer at once.</p>
            <form method="POST" action="" class="mt-auto d-grid">
                <button type="submit" class="btn btn-primary w-100 fw-bold">Generate Monthly Invoices (Batch)</button>
            </form>
        </article>

        <article class="card billing-panel p-4" aria-labelledby="isolated-billing-title">
            <h3 id="isolated-billing-title" class="h6 fw-bold mb-3">Specific Organizer</h3>
            <div class="invoice-controls mb-4">
                <div class="invoice-control invoice-control-wide">
                    <label class="form-label text-uppercase fw-bold mb-2">Organizer</label>
                    <button
                        class="btn btn-outline-light w-100 text-start d-flex justify-content-between align-items-center"
                        type="button">
                        <span class="panel-muted">Select organizer</span>
                        <app-lucide-icon name="chevron-down" [size]="16"></app-lucide-icon>
                    </button>
                </div>
                <div class="invoice-control">
                    <label class="form-label text-uppercase fw-bold mb-2" for="invoice-cycle-field">Target Cycle</label>
                    <input type="text" id="invoice-cycle-field" class="form-control" readonly aria-readonly="true"
                        placeholder="MM/YY" value="" />
                </div>
            </div>
            <button type="button" class="btn btn-primary w-100 fw-bold">Generate Invoice</button>
        </article>
    </div>
</section>
