<header class="navbar navbar-expand-lg app-header" aria-label="Platform Navigation">
    <div class="container-fluid app-header-inner">
        <div class="d-flex align-items-center gap-2">
            @if (showMenuButton()) {
            <button type="button" class="btn header-menu-btn" aria-controls="platform-sidebar"
                [attr.aria-expanded]="menuExpanded()" aria-label="Toggle navigation menu" (click)="onMenuToggle()">
                <app-lucide-icon [name]="menuExpanded() ? 'x' : 'menu'" [size]="18"></app-lucide-icon>
            </button>
            }

            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold mb-0" href="#" aria-label="EventHub home">
                @if (showBrandLogo()) {
                <app-lucide-icon class="header-brand-logo" name="ticket" [size]="20"></app-lucide-icon>
                }
                <span class="header-brand-name">{{ brandName() }}</span>
            </a>
        </div>

        <div class="d-flex align-items-center gap-2 ms-auto">
            @if (showThemeToggle()) {
            <button type="button" class="btn header-theme-toggle-btn" [attr.aria-label]="themeToggleLabel()"
                [attr.title]="themeToggleLabel()" (click)="toggleTheme()">
                @if (theme() === 'dark') {
                <app-lucide-icon name="sun" [size]="16"></app-lucide-icon>
                } @else {
                <app-lucide-icon name="moon" [size]="16"></app-lucide-icon>
                }
            </button>
            }

            @if (showProfile()) {
            <div class="d-flex align-items-center gap-2 app-header-profile" role="button" tabindex="0"
                aria-label="User profile placeholder">
                <app-lucide-icon class="header-profile-icon" name="user-round" [size]="17"></app-lucide-icon>
                <span class="header-profile-name fw-semibold">{{ profileName() }}</span>
            </div>
            }
        </div>
    </div>
</header>
