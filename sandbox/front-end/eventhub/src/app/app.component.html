<button type="button" class="btn theme-toggle" [attr.aria-label]="themeToggleLabel()" [attr.title]="themeToggleLabel()"
  (click)="toggleTheme()">
  @if (theme() === 'dark') {
  <span class="material-symbols-outlined" aria-hidden="true">light_mode</span>
  } @else {
  <span class="material-symbols-outlined" aria-hidden="true">dark_mode</span>
  }
</button>
