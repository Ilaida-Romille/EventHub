<div class="platform-shell" [class.sidebar-collapsed]="collapsed()">
    <app-sidebar [profileName]="profileName()" [profileRole]="profileRole()"
        (collapsedChange)="onSidebarCollapsedChange($event)"></app-sidebar>

    <section class="platform-content-wrap">
        <header class="platform-topbar">
            <div>
                <h1 class="platform-headline">{{ title() }}</h1>
                <p class="platform-subtitle">{{ subtitle() }}</p>
            </div>
        </header>

        <main class="platform-content">
            <ng-content></ng-content>
        </main>
    </section>
</div>
