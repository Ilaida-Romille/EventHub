<div class="platform-shell" [class.sidebar-collapsed]="showCollapsedSidebar()">
    @if (!isMobile()) {
    <app-sidebar [profileName]="profileName()" [profileRole]="profileRole()" [(isCollapsed)]="collapsed">
    </app-sidebar>
    }

    <section class="platform-content-wrap">
        <header class="platform-topbar">
            @if (isMobile()) {
            <app-header [brandName]="'EventHub'" [showMenuButton]="false" [showProfile]="true" [showProfileName]="false"
                [showThemeToggle]="true" [showBrandLogo]="true" [logoutRoute]="'/login'"></app-header>
            }
        </header>

        <main class="platform-content" [class.fluid]="fluidContent()" [class.mobile-nav-spaced]="isMobile()">
            <ng-content></ng-content>
        </main>
    </section>

    @if (isMobile()) {
    <app-mobile-bottom-nav></app-mobile-bottom-nav>
    }
</div>
