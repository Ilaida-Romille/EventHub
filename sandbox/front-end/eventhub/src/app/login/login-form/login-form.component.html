<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
    <div class="mb-3">
        <label for="email" class="form-label text-uppercase text-secondary fw-bold field-label">
            Email address
        </label>
        <input type="email" class="form-control" id="email" formControlName="email" placeholder="e.g., john@company.com"
            autocomplete="email" />
    </div>

    <div class="mb-4">
        <label for="password" class="form-label text-uppercase text-secondary fw-bold field-label">
            Password
        </label>
        <input type="password" class="form-control" id="password" formControlName="password" placeholder="••••••••"
            autocomplete="current-password" />
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="form-check d-flex align-items-center gap-2">
            <input class="form-check-input mt-0 remember-checkbox" type="checkbox" id="remember"
                formControlName="remember" />
            <label class="form-check-label m-0 remember-label" for="remember">
                Remember me
            </label>
        </div>
        <a routerLink="/forgot-password" class="text-primary text-decoration-none fw-semibold auth-link">
            Forgot password?
        </a>
    </div>

    <button type="submit" class="btn btn-primary w-100 fw-bold mb-4">
        Sign In
    </button>
</form>
