<section class="login-card fade-up">

    <div class="logo">

        <img src="assets/images/auth/logo.svg" alt="Eventhub">

        <span>Eventhub</span>

    </div>

    <h2>Welcome Back</h2>

    <p class="subtitle">
        Please enter your details to continue
    </p>

    <div class="alert alert-danger mb-4" [class.d-none]="!authError">
        {{ authError }}
    </div>

    <app-login-form [isSubmitting]="isSubmitting" (loginSubmit)="loginSubmit.emit($event)" />

</section>
