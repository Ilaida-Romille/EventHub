<form class="login-form" (submit)="onSubmit($event)">

    <div class="mb-3">

        <label for="email" class="form-label">

            Email Address

        </label>

        <input id="email" type="email" class="form-control placeholder-light" placeholder="Enter your email"
            [formField]="loginForm.email">

    </div>

    <div class="mb-3">

        <label for="password" class="form-label">

            Password

        </label>


        <div class="password-wrapper">
            <input id="password" [type]="hidePassword() ? 'password' : 'text'" placeholder="Enter your password"
                class="form-control placeholder-light" [formField]="loginForm.password" />

            <button type="button" class="toggle-password" (click)="togglePassword()">
                <i class="bi" [class.bi-eye]="hidePassword()" [class.bi-eye-slash]="!hidePassword()">
                </i>
            </button>
        </div>

    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div class="form-check">

            <input id="remember" class="form-check-input" type="checkbox" [formField]="loginForm.remember">

            <label class="form-check-label" for="remember">

                Remember me

            </label>

        </div>

        <a href="#">

            Forgot Password?

        </a>

    </div>

    <button class="btn btn-primary w-100" type="submit" [disabled]="isSubmitting">

        Sign In

    </button>

</form>
