<section class="users-shell">
    <app-header brandName="EventHub" profileName="Juan Dela Cruz" [showThemeToggle]="true" [showProfile]="true"
        [logoutRoute]="'/login'">
    </app-header>

    <main class="users-main" id="main-content">
        <div class="events-toolbar d-flex align-items-center justify-content-between mb-4 flex-wrap gap-3">
            <app-category-switch [tabs]="['Upcoming', 'Recently Added']" [selectedTab]="activeCategory()"
                (tabChange)="activeCategory.set($event)">
            </app-category-switch>

            <div class="merged-toolbar-pill d-flex align-items-center">
                <app-search-bar (search)="onSearchSubmitted($event)"></app-search-bar>
                <div class="pill-divider"></div>
                <app-view-toggle [view]="activeView()" (viewChange)="activeView.set($event)">
                </app-view-toggle>
            </div>
        </div>

        <section aria-label="Event listings">
            @if (activeView() === 'grid') {
            <div class="row g-3 mb-4">
                @for (eventItem of filteredEvents(); track eventItem.id) {
                <div class="col-12 col-sm-6 col-lg-4 d-flex">
                    <app-event-card class="w-100" [event]="eventItem" [view]="activeView()"></app-event-card>
                </div>
                } @empty {
                <div class="col-12 empty-state">
                    <p>No events found matching your criteria.</p>
                </div>
                }
            </div>
            } @else {
            <div class="events-list d-flex flex-column gap-3 mb-4">
                @for (eventItem of filteredEvents(); track eventItem.id) {
                <app-event-card [event]="eventItem" [view]="activeView()"></app-event-card>
                } @empty {
                <div class="empty-state">
                    <p>No events found matching your criteria.</p>
                </div>
                }
            </div>
            }

            @if (totalPages() > 1) {
            <div class="d-flex justify-content-end align-items-center mt-4 pt-2">
                <app-pagination-controls prevId="btn-prev-events" nextId="btn-next-events"
                    indicatorId="events-page-indicator" [indicatorText]="pageIndicatorText()" align="end"
                    (prevClick)="onPrevPage()" (nextClick)="onNextPage()">
                </app-pagination-controls>
            </div>
            }
        </section>
    </main>
</section>
