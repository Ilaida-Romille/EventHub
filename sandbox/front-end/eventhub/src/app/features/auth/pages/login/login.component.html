<main class="container-fluid row vh-100 px-0 overflow-hidden m-0">
    <button type="button" class="btn login-theme-toggle" [attr.aria-label]="themeToggleLabel()"
        [attr.title]="themeToggleLabel()" (click)="toggleTheme()">
        @if (theme() === 'dark') {
        <app-lucide-icon name="sun" [size]="18"></app-lucide-icon>
        } @else {
        <app-lucide-icon name="moon" [size]="18"></app-lucide-icon>
        }
    </button>

    <section class="col-md-6 bg-gradient-dark position-relative d-flex align-items-center justify-content-center p-5">
        <div class="hero-decoration">
            <div class="decoration-circle decoration-circle-1"></div>
            <div class="decoration-circle decoration-circle-2"></div>
        </div>

        <div class="hero-content">
            <div class="d-flex align-items-center gap-2 mb-4">
                <app-lucide-icon class="hero-brand-icon" name="ticket" [size]="28"></app-lucide-icon>
                <span class="fs-4 fw-bolder hero-brand">EventHub</span>
            </div>

            <h1 class="display-5 fw-bolder hero-title mb-3">
                <strong>Streamline Your Corporate Events</strong>
            </h1>
            <p class="hero-description fs-6">
                Welcome to a modernized platform built to seamlessly organize, manage, and discover corporate events
                all in one place.
            </p>
        </div>
    </section>

    <section class="col-md-6 d-flex align-items-center justify-content-center p-5 login-panel">
        <div class="w-100 login-panel-content">

            <app-login-form [isSubmitting]="isSubmitting()" [authError]="authError()"
                (formSubmit)="onLoginSubmit($event)" />

            <div class="login-divider text-center my-4">
                <span class="text-secondary text-lowercase fs-6">or sign in with:</span>
            </div>

            <div class="d-flex justify-content-center gap-3 mb-4">
                <a href="#" class="social-btn social-btn-facebook text-decoration-none"
                    aria-label="Sign in with Facebook">
                    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
                        <path fill="currentColor"
                            d="M13.47 20.82v-7.67h2.58l.39-2.99h-2.97V8.25c0-.87.24-1.46 1.49-1.46h1.59V4.11c-.77-.08-1.55-.12-2.33-.11-2.3 0-3.87 1.4-3.87 3.99v2.23H7.75v2.99h2.59v7.6a9 9 0 1 1 3.13.01Z" />
                    </svg>
                </a>
                <a href="#" class="social-btn social-btn-google text-decoration-none" aria-label="Sign in with Google">
                    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
                        <path fill="#EA4335"
                            d="M12 10.2v3.9h5.4c-.23 1.25-.96 2.31-2.02 3.01l3.27 2.53c1.9-1.75 2.99-4.34 2.99-7.42 0-.66-.06-1.3-.18-1.91H12Z" />
                        <path fill="#34A853"
                            d="M12 22c2.7 0 4.97-.9 6.63-2.44l-3.27-2.53c-.9.61-2.06.97-3.36.97-2.58 0-4.76-1.74-5.54-4.08H3.08v2.6A10 10 0 0 0 12 22Z" />
                        <path fill="#4A90E2"
                            d="M6.46 13.92A6 6 0 0 1 6.15 12c0-.67.12-1.31.31-1.92V7.48H3.08A10 10 0 0 0 2 12c0 1.61.39 3.13 1.08 4.44l3.38-2.52Z" />
                        <path fill="#FBBC05"
                            d="M12 6a5.43 5.43 0 0 1 3.84 1.5l2.88-2.89A9.63 9.63 0 0 0 12 2 10 10 0 0 0 3.08 7.48l3.38 2.6C7.24 7.74 9.42 6 12 6Z" />
                    </svg>
                </a>
                <a href="#" class="social-btn social-btn-x text-decoration-none" aria-label="Sign in with X">
                    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
                        <path fill="currentColor"
                            d="M18.24 2h3.3l-7.2 8.23L22.8 22h-6.63l-5.2-6.8L5 22H1.7l7.7-8.8L1.2 2h6.8l4.7 6.2L18.24 2Zm-1.16 18h1.83L7.02 3.9H5.06L17.08 20Z" />
                    </svg>
                </a>
                <a href="#" class="social-btn social-btn-github text-decoration-none" aria-label="Sign in with GitHub">
                    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
                        <path fill="currentColor"
                            d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.57.1.78-.25.78-.56v-2.15c-3.16.69-3.83-1.35-3.83-1.35-.52-1.3-1.26-1.65-1.26-1.65-1.03-.7.08-.69.08-.69 1.13.08 1.73 1.16 1.73 1.16 1.01 1.73 2.64 1.23 3.29.94.1-.73.39-1.23.71-1.51-2.52-.29-5.18-1.26-5.18-5.61 0-1.24.44-2.25 1.16-3.05-.12-.29-.5-1.46.11-3.04 0 0 .95-.3 3.11 1.16a10.85 10.85 0 0 1 5.67 0c2.16-1.46 3.11-1.16 3.11-1.16.61 1.58.23 2.75.11 3.04.72.8 1.16 1.81 1.16 3.05 0 4.36-2.66 5.32-5.2 5.6.41.35.77 1.04.77 2.11v3.13c0 .31.2.67.79.56A11.5 11.5 0 0 0 12 .5Z" />
                    </svg>
                </a>
            </div>

            <div class="login-divider text-center"></div>

            <div class="text-center pt-4">
                <p class="text-secondary fs-6 mb-3">Don't have an account?</p>
                <div class="d-flex flex-column gap-2">
                    <a routerLink="/users/employee-registration"
                        class="btn btn-outline-primary w-100 fw-bold d-flex align-items-center justify-content-center gap-2">
                        <app-lucide-icon class="auth-role-icon" name="users" [size]="18"></app-lucide-icon>
                        Sign up as Employee
                    </a>
                    <a routerLink="/organizer/organizer-registration"
                        class="btn btn-outline-primary w-100 fw-bold d-flex align-items-center justify-content-center gap-2">
                        <app-lucide-icon class="auth-role-icon" name="building-2" [size]="18"></app-lucide-icon>
                        Sign up as Organizer
                    </a>
                </div>
            </div>
        </div>
    </section>
</main>
