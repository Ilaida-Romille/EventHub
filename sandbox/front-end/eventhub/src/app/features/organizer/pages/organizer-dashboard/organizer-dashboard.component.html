<app-privileged-layout [layoutContext]="'organizer'" [profileRole]="'Organizer Admin'" [profileName]="'Jane Dela Cruz'">
    <main class="organizer-main">
        <header class="dashboard-welcome">
            <h1 class="page-title">Welcome back, Acme Events Co.</h1>
            <p class="subtitle-prompt">What would you like to do today?</p>
        </header>

        <section class="row row-cols-1 row-cols-md-2 g-3" aria-label="Workspace Hub Options">
            @for (card of workspaceCards; track card.title) {
            <div class="col">
                <article class="card workspace-card h-100">
                    <div class="card-icon-box">
                        <app-lucide-icon [name]="card.icon" [size]="22"></app-lucide-icon>
                    </div>
                    <div class="card-body-content">
                        <h2>{{ card.title }}</h2>
                        <p>{{ card.body }}</p>
                    </div>
                    <a [routerLink]="card.route" class="btn btn-primary card-action-trigger">{{ card.actionLabel }}</a>
                </article>
            </div>
            }
        </section>
    </main>
</app-privileged-layout>
