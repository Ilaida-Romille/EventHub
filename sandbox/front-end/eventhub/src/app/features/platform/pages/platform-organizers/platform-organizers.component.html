<app-privileged-layout>
    <app-search-filter-card class="d-block mb-4" [fields]="organizerFilters" actionId="organizers-search-btn"
        actionLabel="Search" [initialValues]="activeFilters()"
        (filtersSubmitted)="onFiltersSubmitted($event)"></app-search-filter-card>

    <app-data-table tableId="organizers-table" [columns]="organizerColumns" [rows]="pagedRows()"
        [currentPage]="currentPage()" [pageSize]="pageSize()" [totalItems]="totalItems()" [sortState]="sortState()"
        [toolbarActions]="tableActions" [rowActions]="rowActions" (sortChanged)="onSortChanged($event)"
        (pageChanged)="onPageChanged($event)" (rowActionTriggered)="onRowAction($event)">
    </app-data-table>
</app-privileged-layout>
