<app-platform-layout>
    <app-kpi-cards [cards]="kpiCards"></app-kpi-cards>

    <app-analytics-bar-chart [bars]="analyticsBars"></app-analytics-bar-chart>

    <nav class="shortcut-list" aria-label="Quick Actions Summary">
        <a routerLink="/platform/organizers" class="btn-shortcut">
            <span>View Organizers</span>
            <app-lucide-icon name="arrow-right" [size]="15"></app-lucide-icon>
        </a>
        <a routerLink="/platform/billing" class="btn-shortcut">
            <span>View Billing</span>
            <app-lucide-icon name="arrow-right" [size]="15"></app-lucide-icon>
        </a>
        <a routerLink="/platform/tickets" class="btn-shortcut">
            <span>View Tickets</span>
            <app-lucide-icon name="arrow-right" [size]="15"></app-lucide-icon>
        </a>
    </nav>
</app-platform-layout>
