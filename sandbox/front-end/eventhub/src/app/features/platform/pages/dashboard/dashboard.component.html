<app-platform-layout title="Welcome back, John" subtitle="Measure your event ROI and monitor organizer activity.">
    <section class="metrics-section" aria-label="Metrics Overview">
        <div class="metrics-item">
            <div class="card kpi-card p-4">
                <div id="kpi-total-organizers" class="value mb-1">2,031</div>
                <div class="text-uppercase fw-bold metric-label">Total Organizers</div>
            </div>
        </div>
        <div class="metrics-item">
            <div class="card kpi-card p-4">
                <div id="kpi-total-events" class="value mb-1">19,230</div>
                <div class="text-uppercase fw-bold metric-label">Total Events (This Year)</div>
            </div>
        </div>
    </section>


    <section class="card p-4 mb-4" aria-label="Analytics Visualization">
        <div class="fw-bold mb-4 text-uppercase analytics-title">Events Distribution per Month</div>
        <div class="chart-container">
            <div class="bar-chart">
                <div class="chart-grid" aria-hidden="true">
                    <div class="grid-line"><span>2.5k</span></div>
                    <div class="grid-line"><span>2.0k</span></div>
                    <div class="grid-line"><span>1.5k</span></div>
                    <div class="grid-line"><span>1.0k</span></div>
                    <div class="grid-line"><span>500</span></div>
                    <div class="grid-line"><span>0</span></div>
                </div>

                <div class="chart-bars">
                    <div class="bar-wrapper" style="--value: 45%;">
                        <div class="bar" data-value="1,125"></div>
                        <span class="month">Jan</span>
                    </div>
                    <div class="bar-wrapper" style="--value: 65%;">
                        <div class="bar" data-value="1,625"></div>
                        <span class="month">Feb</span>
                    </div>
                    <div class="bar-wrapper" style="--value: 80%;">
                        <div class="bar" data-value="2,000"></div>
                        <span class="month">Mar</span>
                    </div>
                    <div class="bar-wrapper" style="--value: 55%;">
                        <div class="bar" data-value="1,375"></div>
                        <span class="month">Apr</span>
                    </div>
                    <div class="bar-wrapper" style="--value: 90%;">
                        <div class="bar" data-value="2,250"></div>
                        <span class="month">May</span>
                    </div>
                    <div class="bar-wrapper" style="--value: 70%;">
                        <div class="bar" data-value="1,750"></div>
                        <span class="month">Jun</span>
                    </div>
                    <div class="bar-wrapper" style="--value: 85%;">
                        <div class="bar" data-value="2,125"></div>
                        <span class="month">Jul</span>
                    </div>
                    <div class="bar-wrapper" style="--value: 60%;">
                        <div class="bar" data-value="1,500"></div>
                        <span class="month">Aug</span>
                    </div>
                    <div class="bar-wrapper" style="--value: 75%;">
                        <div class="bar" data-value="1,875"></div>
                        <span class="month">Sep</span>
                    </div>
                    <div class="bar-wrapper" style="--value: 50%;">
                        <div class="bar" data-value="1,250"></div>
                        <span class="month">Oct</span>
                    </div>
                    <div class="bar-wrapper" style="--value: 95%;">
                        <div class="bar" data-value="2,375"></div>
                        <span class="month">Nov</span>
                    </div>
                    <div class="bar-wrapper" style="--value: 40%;">
                        <div class="bar" data-value="1,000"></div>
                        <span class="month">Dec</span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <nav class="shortcut-list" aria-label="Quick Actions Summary">
        <a routerLink="/platform/organizers" class="btn-shortcut">
            <span>View Organizers</span>
            <app-lucide-icon name="arrow-right" [size]="15"></app-lucide-icon>
        </a>
        <a routerLink="/platform/billing" class="btn-shortcut">
            <span>View Billing</span>
            <app-lucide-icon name="arrow-right" [size]="15"></app-lucide-icon>
        </a>
        <a routerLink="/platform/tickets" class="btn-shortcut">
            <span>View Tickets</span>
            <app-lucide-icon name="arrow-right" [size]="15"></app-lucide-icon>
        </a>
    </nav>
</app-platform-layout>
