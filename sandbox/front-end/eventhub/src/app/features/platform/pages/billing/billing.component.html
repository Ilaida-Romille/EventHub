<app-platform-layout>
    <app-search-filter-card class="d-block mb-4" [fields]="billingFilters" actionId="billing-search-btn"
        actionLabel="Search" [initialValues]="activeFilters()"
        (filtersSubmitted)="onFiltersSubmitted($event)"></app-search-filter-card>

    <app-data-table tableId="billing-table" [columns]="billingColumns" [rows]="pagedRows()"
        [currentPage]="currentPage()" [pageSize]="pageSize()" [totalItems]="totalItems()" [sortState]="sortState()"
        [toolbarActions]="tableActions" [rowActions]="rowActions" (sortChanged)="onSortChanged($event)"
        (pageChanged)="onPageChanged($event)" (toolbarActionTriggered)="onToolbarAction($event)"
        (rowActionTriggered)="onRowAction($event)">
    </app-data-table>

    <p class="table-state-message mt-3 mb-0">{{ lastInteraction() }}</p>

    <app-invoice-generator-cards></app-invoice-generator-cards>
</app-platform-layout>
