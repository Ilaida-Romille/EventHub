<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Discover and register for upcoming corporate events." />
    <title>EventHub - Upcoming Events</title>
    <link rel="stylesheet" href="../css/users/upcoming-events.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=300..800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>

<body>
    <header class="header">
        <nav class="container-fluid navbar navbar-expand-md px-5 py-3">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bolder fs-5" href="../index.html">
                <span class="material-symbols-outlined logo-icon fs-4">event</span>
                <span class="text-white">EventHub</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown"
                aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-end" id="navbarNavDropdown">
                <ul class="navbar-nav">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle text-white fw-medium opacity-75" href="#" role="button"
                            data-bs-toggle="dropdown" aria-expanded="false" style="font-size: 0.95rem;">
                            Juan Dela Cruz
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item text-danger" href="../index.html">Logout</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="container p-4">
        <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4">
            <h1 class="h3 fw-extrabold text-white m-0">Upcoming Events</h1>
        </div>

        <div class="filter-row mb-4">
            <form class="filter-form" method="GET" action="">
                <div class="row g-3 align-items-end">
                    <div class="col-12 col-md-4">
                        <label for="search" class="form-label text-secondary fw-bold mb-2"
                            style="font-size: 0.85rem;">Search Events</label>
                        <input type="text" id="search" name="search" placeholder="Type keywords..." />
                    </div>

                    <div class="col-12 col-sm-4 col-md-2">
                        <label for="category" class="form-label text-secondary fw-bold mb-2"
                            style="font-size: 0.85rem;">Category</label>
                        <select id="category" name="category">
                            <option value="">All Categories</option>
                            <option value="tech">Tech & Innovation</option>
                            <option value="corporate">Corporate</option>
                            <option value="social">Social Gatherings</option>
                        </select>
                    </div>

                    <div class="col-12 col-sm-4 col-md-2">
                        <label for="start-date" class="form-label text-secondary fw-bold mb-2"
                            style="font-size: 0.85rem;">From Date</label>
                        <input type="date" id="start-date" name="start_date" />
                    </div>

                    <div class="col-12 col-sm-4 col-md-2">
                        <label for="end-date" class="form-label text-secondary fw-bold mb-2"
                            style="font-size: 0.85rem;">To Date</label>
                        <input type="date" id="end-date" name="end_date" />
                    </div>

                    <div class="col-12 col-md-2">
                        <button type="submit" class="btn btn-primary w-100 fw-bold"
                            style="height: 44px;">Search</button>
                    </div>
                </div>
            </form>
        </div>

        <div class="sort-pill-container mb-4">
            <span class="sort-label">Order by:</span>
            <div class="pill-group">
                <a href="?date=upcoming" class="pill-btn active">Upcoming First</a>
                <a href="?date=recent" class="pill-btn">Recently Added</a>
            </div>
        </div>

        <div id="upcoming-events-grid" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"
            aria-label="Upcoming Events Listings"></div>

        <nav class="pagination-wrapper" aria-label="Pagination Navigation">
            <ul id="upcoming-events-pagination" class="pagination"></ul>
        </nav>
    </main>

    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./js/upcoming-events.js"></script>
</body>

</html>
