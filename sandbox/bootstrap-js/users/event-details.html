<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="View Agenda and Attendees for events." />
    <title>EventHub - Tech Summit 2026 Details</title>
    <link rel="stylesheet" href="../css/users/event-details.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>

<body>
    <header class="header">
        <nav class="container-fluid navbar navbar-expand-md px-5 py-3">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bolder fs-5" href="../index.html">
                <span class="material-symbols-outlined logo-icon fs-4">event</span>
                <span class="text-white">EventHub</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown"
                aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-end" id="navbarNavDropdown">
                <ul class="navbar-nav">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle text-white fw-medium opacity-75" href="#" role="button"
                            data-bs-toggle="dropdown" aria-expanded="false" style="font-size: 0.95rem;">
                            Juan Dela Cruz
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item text-danger" href="../index.html">Logout</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="container px-4 py-5">
        <div class="row g-4 g-lg-5">
            <section class="col-12 col-lg-8" aria-label="Event Agenda">
                <h2 class="h3 fw-bold mb-4">Agenda</h2>
                <div id="event-agenda-list" class="d-flex flex-column gap-3"></div>
            </section>

            <aside class="col-12 col-md-4">
                <div class="card p-4 mb-4">
                    <h2 class="h4 fw-bold mb-4">Attendees</h2>
                    <div id="event-attendee-list" class="attendee-list"></div>
                    <button class="btn btn-primary w-100 mt-3 fw-bold" type="button">View All &
                        Connect</button>
                </div>

                <div class="card p-4 mb-4">
                    <h2 class="h4 fw-bold mb-3">Venue Location</h2>
                    <div class="map-container">
                        <iframe
                            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3861.127814986121!2d121.0336214!3d14.6205779!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3397b7b1f5555555%3A0x5555555555555555!2sQuezon%20City%2C%20Metro%20Manila!5e0!3m2!1sen!2sph!4v1710000000000!5m2!1sen!2sph"
                            title="Google Maps" height="220" style="border:0;" allowfullscreen="" loading="lazy"
                            referrerpolicy="no-referrer-when-downgrade">
                        </iframe>
                    </div>
                </div>

                <div class="card p-4 mb-4 text-center">
                    <p class="fs-6 mb-3">Have a question for the organizer?</p>
                    <button class="btn btn-outline-secondary border-secondary w-100 fw-bold" type="button">Message the
                        Organizer</button>
                </div>
            </aside>

        </div>
    </main>

    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./js/event-details.js"></script>
</body>

</html>
