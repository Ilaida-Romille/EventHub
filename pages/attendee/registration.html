<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventHub - Event Registration</title>
    <meta name="description" content="Plan, register, and connect your corporate events with EventHub. The all-in-one event management platform for enterprise organizations, organizers, and attendees.">
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="../../styles/attendee/registration.css">
</head>
<body>

    <!-- Nav Bar Section -->
    <header class="navbar">
        <div class="nav-container">
            <div class="logo" style="font-weight: 700; font-size: 1.15rem;">
                <a href="#" class="logo-link">EventHub</a>
            </div>
            <div class="attendee-profile">
                Juan Dela Cruz <span class="profile-caret">▼</span>
                <a href="../../index.html" class="logout-link">Log Out</a>
            </div>

        </div>
    </header>

    <!-- Registration Section -->
    <main class="registration-container">
        
        <!-- Summary Up Top -->
        <div class="event-summary-card">
            <h1 id="eventTitle" class="event-display-title">Loading Event...</h1>
            <div class="event-display-meta">
                <span id="eventDate">---</span> 
                <span class="meta-divider">•</span> 
                <span>9:00 AM — 5:00 PM</span> 
                <span class="meta-divider">•</span> 
                <span id="eventLocation">---</span>
            </div>
        </div>

        <!-- Forms Below -->
        <section class="registration-form-section">
            <h2 class="form-section-title">Registration Details</h2>
            
            <form class="registration-form" novalidate>
                <div class="form-row">
                    <div class="form-group">
                        <label for="fullName">Full Name *</label>
                        <input 
                            type="text" 
                            id="fullName" 
                            class="form-input" 
                            required
                        >
                        <span class="field-error">This field is required.</span>
                    </div>
                    <div class="form-group">
                        <label for="emailAddress">Email Address *</label>
                        <input 
                            type="email" 
                            id="emailAddress" 
                            class="form-input" 
                            required
                            minlength="15"
                            maxlength="100"
                            pattern="^[a-zA-Z0-9._%+-]+@(?!gmail\.com|yahoo\.com|hotmail\.com|outlook\.com|aol\.com|icloud\.com|protonmail\.com|mail\.com)([a-zA-Z0-9.-]+\.[a-zA-Z]{2,})$"
                            placeholder="you@company.com"
                        >
                        <span class="field-error">Email must be 15-100 characters and use a valid corporate domain.</span>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="companyDept">Company / Department *</label>
                        <input 
                            type="text" 
                            id="companyDept" 
                            class="form-input"
                            required
                        >
                        <span class="field-error">This field is required.</span>
                    </div>
                    <div class="form-group">
                        <label for="dietary">Dietary Restrictions *</label>
                        <input 
                            type="text" 
                            id="dietary" 
                            class="form-input"
                            required
                        >
                        <span class="field-error">This field is required.</span>
                    </div>
                </div>

                <div class="form-group full-width-group">
                    <label for="additionalNotes">Additional Notes (optional)</label>
                    <input type="text" id="additionalNotes" class="form-input">
                </div>

                
                <div class="form-actions">
                    <a href="upcoming_events.html" class="btn btn-outline action-btn">Cancel</a>
                    <button type="submit" class="btn btn-dark action-btn" formaction="agenda.html">Register</button>
                </div>
            </form>
        </section>
    </main>

    <!-- Getting query parameters -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('title')) {
            document.getElementById('eventTitle').innerText = urlParams.get('title');
            document.getElementById('eventDate').innerText = urlParams.get('date');
            document.getElementById('eventLocation').innerText = urlParams.get('location');
        }
    </script>
</body>
</html>
